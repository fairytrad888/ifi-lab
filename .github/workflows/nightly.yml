name: Nightly scan

on:
  schedule:
    - cron: "15 22 * * 1-5"   # 22:15 UTC Mon-Fri = after the US close all year
    - cron: "30 3 * * 2-6"    # 03:30 UTC Tue-Sat catch-up: picks up a session Yahoo published late (idempotent)
  workflow_dispatch:
    inputs:
      backfill:
        description: "Re-scan the last N bars (0 = normal run). Use 250 once to add Playbook history."
        required: false
        default: "0"

permissions:
  contents: write

concurrency: ifi-lab

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: v1.4 tests (ladder, safety nets, freshness, tags, dashboard)
        run: python tests/test_v14.py
      - name: Download data (with freshness check and repair)
        run: python -m ifi.update_data
      - name: Scan, log, outcomes, dashboard
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          BF="${{ github.event.inputs.backfill || '0' }}"
          if [ ! -f logs/events.csv ]; then python -m ifi.scan --backfill 250
          elif [ "$BF" != "0" ]; then python -m ifi.scan --backfill "$BF"
          else python -m ifi.scan; fi
      - name: Commit results
        run: |
          git config user.name "ifi-bot"
          git config user.email "ifi-bot@users.noreply.github.com"
          git add -A logs state docs data/h4 data/earnings
          git diff --cached --quiet || git commit -m "Nightly scan $(date -u +%F)"
          git pull --rebase --autostash && git push
