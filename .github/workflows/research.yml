name: Research

on:
  workflow_dispatch:
    inputs:
      step:
        description: "all = Step 0, then Step 1 gated by Step 0; diagnose = input checks only; exits = E4 exit test v1"
        type: choice
        options: [all, step0, step1, diagnose, exits]
        default: all
      refresh_data:
        description: "Download a new frozen data snapshot (leave off to reuse the committed one)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: ifi-lab

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (versions pinned to the ones the research code was validated with)
        run: |
          pip install -r requirements.txt
          pip install pandas==3.0.6 numpy==2.5.4 scipy==1.18.1 matplotlib==3.11.2 yfinance==1.7.0
      - name: Engine smoke tests (indicators, parity, no look-ahead)
        run: python tests/test_smoke.py
      - name: Research tests (state machines, look-ahead, bootstrap, lock, fixtures)
        run: python tests/test_research.py
      - name: Exit-test unit tests (every exit by hand, Lab parity, truncation, lock)
        run: python tests/test_exits.py
      - name: Run research gates (or diagnostics)
        run: |
          if [ "${{ inputs.step }}" = "diagnose" ]; then
            python -m research.diagnose
          elif [ "${{ inputs.step }}" = "exits" ]; then
            if [ "${{ inputs.refresh_data }}" = "true" ]; then python -m research.exits.run --refresh-data; else python -m research.exits.run; fi
          else
            ARGS="--step ${{ inputs.step }}"
            if [ "${{ inputs.refresh_data }}" = "true" ]; then ARGS="$ARGS --refresh-data"; fi
            python -m research.run $ARGS
          fi
      - name: Commit results and snapshot
        run: |
          git config user.name "ifi-bot"
          git config user.email "ifi-bot@users.noreply.github.com"
          if [ -d reports/research ]; then git add reports/research; fi
          if [ -d research/snapshot ]; then git add research/snapshot; fi
          if [ -d reports/exits ]; then git add reports/exits; fi
          if [ -d research/exits/snapshot ]; then git add research/exits/snapshot; fi
          git diff --cached --quiet || git commit -m "Research ${{ inputs.step }} $(date -u +%F)"
          git pull --rebase --autostash && git push
