name: R007 confluence ladder

# Isolated from the prior IFI Lab, the Eye Lab and the weekly scan:
#  - manual runs only; its own concurrency group
#  - refuses to run inside the prior system's or the weekly scan's windows (r007/config.yaml guard_windows_utc)
#  - reads the branch weekscan-results (never writes it); writes only to the branch r007-results
#  - verifies the freeze of the prior system and the R007 pre-registration lock, and fails if the checkout changed
#  - outcomes can be computed only in the phase1 step (R007_PHASE=1), only for S1+S2, and only once

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "selftest | phase0 | phase1"
        type: choice
        options: [selftest, phase0, phase1]
        default: selftest

permissions:
  contents: write

defaults:
  run:
    shell: bash          # bash -eo pipefail: a failing python before `| tee` fails the step

concurrency:
  group: r007
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Output folder outside the checkout
        run: echo "R007_OUT=$RUNNER_TEMP/r007-results" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r r007/requirements.txt

      - name: Guard window (not while the prior system or the weekly scan works, for the whole run)
        run: python -c "from r007.guard import overlaps_guard as w; import sys; r=w(minutes=150); print('window:', r or 'clear'); sys.exit(1 if r else 0)"

      - name: Freeze of the prior system and the R007 lock
        run: |
          python -m eyelab.freeze verify
          python -m r007.run verify

      - name: Live reference (read-only fetch of weekscan-results)
        run: git fetch --no-tags --depth=300 origin +refs/heads/weekscan-results:refs/remotes/origin/weekscan-results

      - name: Results branch (separate from the default branch)
        run: |
          git config user.name "r007-bot"
          git config user.email "r007-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin r007-results >/dev/null; then
            git fetch --depth 1 origin r007-results
            git worktree add "$R007_OUT" FETCH_HEAD
            git -C "$R007_OUT" checkout -B r007-results
          else
            git worktree add --detach "$R007_OUT"
            git -C "$R007_OUT" checkout --orphan r007-results
            git -C "$R007_OUT" rm -rfq . || true
            git -C "$R007_OUT" clean -fdq
          fi

      - name: Tests
        run: python r007/tests/test_r007.py

      - name: Selftest
        if: inputs.stage == 'selftest'
        run: python r007/tests/test_r007.py > "$R007_OUT/SELFTEST.txt"

      - name: Snapshot (live reference, symbol sets, one-time price download)
        if: inputs.stage == 'phase0'
        run: python -m r007.run snapshot 2>&1 | tee "$R007_OUT/SNAPSHOT_log.txt"

      - name: Commit the snapshot on its own (kept even if Phase 0 fails later)
        if: inputs.stage == 'phase0'
        run: |
          cd "$R007_OUT"
          git add -A
          git commit -qm "R007 snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "snapshot unchanged (reused)"; exit 0; }
          git push origin r007-results

      - name: Phase 0
        if: inputs.stage == 'phase0'
        run: python -m r007.run phase0 2>&1 | tee "$R007_OUT/PHASE0_log.txt"

      - name: Phase 1 marker (one-time; refused if Phase 1 was ever started)
        if: inputs.stage == 'phase1'
        run: |
          python -m r007.run phase1-mark
          cd "$R007_OUT"
          git add PHASE1.started
          git commit -qm "R007 phase1 started (run $GITHUB_RUN_ID)"
          git push origin r007-results

      - name: Phase 1 (gate on S1+S2; runs once; outcomes for S1+S2 only)
        if: inputs.stage == 'phase1'
        env:
          R007_PHASE: "1"
        run: python -m r007.run phase1 2>&1 | tee -a "$R007_OUT/PHASE1_log.txt"

      - name: Isolation check (the checkout must be untouched)
        if: always()
        run: |
          CHANGES=$(git status --porcelain --ignored=no | grep -v '^?? r007/_out/' || true)
          if [ -n "$CHANGES" ]; then echo "ISOLATION BREACH: the run changed the checkout:"; echo "$CHANGES"; exit 1; fi
          python -m eyelab.freeze verify
          python -m r007.run verify

      - name: Push results to r007-results (also after a failed step, so logs are kept)
        if: always()
        run: |
          [ -d "$R007_OUT/.git" ] || [ -f "$R007_OUT/.git" ] || { echo "no results worktree"; exit 0; }
          cd "$R007_OUT"
          git add -A
          git commit -qm "R007 ${{ inputs.stage }} ${{ job.status }} $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing to commit"; exit 0; }
          git push origin r007-results
