name: Backtests

on:
  workflow_dispatch:
    inputs:
      universe:
        type: choice
        options: [etfs, stocks, all]
        default: etfs
      tf:
        type: choice
        options: [daily, h4]
        default: daily
  schedule:
    - cron: "0 12 * * 6"      # Saturdays: full queue

permissions:
  contents: write

concurrency: ifi-lab

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Smoke test (indicators + no look-ahead)
        run: python tests/test_smoke.py
      - name: Download data
        run: python -m ifi.update_data
      - name: Run experiments
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m ifi.run_backtests --tf daily --universe etfs
            python -m ifi.run_backtests --tf daily --universe stocks
            python -m ifi.run_backtests --tf h4 --universe etfs
          else
            python -m ifi.run_backtests --tf ${{ inputs.tf }} --universe ${{ inputs.universe }}
          fi
      - name: Refresh dashboard, scoreboard and drift check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m ifi.scan
      - name: Commit reports
        run: |
          git config user.name "ifi-bot"
          git config user.email "ifi-bot@users.noreply.github.com"
          git add -A reports docs logs state data/h4 data/earnings
          git diff --cached --quiet || git commit -m "Backtests $(date -u +%F)"
          git pull --rebase --autostash && git push
